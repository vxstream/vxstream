<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VXST / Neyka</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --fg: #000000;
  --muted: #888888;
  --border: #eaeaea;
  --card-bg: #ffffff;
  --card-border: #eaeaea;
  --dot: #d0d0d0;
  --glow: rgba(0,0,0,0.03);
  --tag-bg: #f5f5f5;
  --tag-fg: #000000;
  --hover-border: #000000;
}

.dark {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #666666;
  --border: #222222;
  --card-bg: #0a0a0a;
  --card-border: #222222;
  --dot: #1a1a1a;
  --glow: rgba(255,255,255,0.02);
  --tag-bg: #111111;
  --tag-fg: #ffffff;
  --hover-border: #ffffff;
}

html { font-size: 16px; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.4s ease, color 0.4s ease;
  position: relative;
  overflow-x: hidden;
}

#dot-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.6;
}

#theme-toggle {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 10;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--fg);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.3s ease;
}

#theme-toggle:hover {
  border-color: var(--hover-border);
  transform: scale(1.05);
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  padding: 40px 24px;
}

/* Profile section */
.profile {
  text-align: center;
  margin-bottom: 48px;
}

.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--tag-bg);
  border: 2px solid var(--card-border);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1px;
  transition: border-color 0.3s ease;
  user-select: none;
}

.avatar:hover {
  border-color: var(--hover-border);
}

.name {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 6px;
}

.aliases {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 12px;
  font-weight: 400;
}

.pronouns {
  display: inline-block;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  background: var(--tag-bg);
  padding: 4px 12px;
  border-radius: 100px;
  letter-spacing: 0.3px;
}

/* Bio */
.bio {
  text-align: center;
  font-size: 15px;
  line-height: 1.6;
  color: var(--muted);
  margin-bottom: 48px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.bio strong {
  color: var(--fg);
  font-weight: 600;
}

/* Divider */
.divider {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin-bottom: 40px;
}

/* Section title */
.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-bottom: 16px;
}

/* Project card */
.project-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 16px;
  transition: all 0.3s ease;
  cursor: default;
}

.project-card:hover {
  border-color: var(--hover-border);
  background: var(--glow);
}

.project-card .project-name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.project-card .project-name .badge {
  font-size: 10px;
  font-weight: 600;
  background: var(--tag-bg);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.3px;
}

.project-card .project-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.project-card .project-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--fg);
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.2s ease;
}

.project-card .project-link:hover {
  opacity: 0.6;
}

.project-card .project-link svg {
  width: 14px;
  height: 14px;
}

/* Links grid */
.links-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 40px;
}

.link-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  text-decoration: none;
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.3s ease;
}

.link-item:hover {
  border-color: var(--hover-border);
  background: var(--glow);
}

.link-item .link-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.link-item .link-icon svg {
  width: 18px;
  height: 18px;
}

.link-item .link-label {
  flex: 1;
}

.link-item .link-arrow {
  color: var(--muted);
  font-size: 16px;
  transition: transform 0.3s ease;
}

.link-item:hover .link-arrow {
  transform: translateX(3px);
}

/* Tags */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 40px;
}

.tag {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  background: var(--tag-bg);
  color: var(--tag-fg);
  border-radius: 100px;
  border: 1px solid var(--card-border);
  transition: all 0.3s ease;
}

.tag:hover {
  border-color: var(--hover-border);
}

/* Footer */
.footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding-top: 8px;
  letter-spacing: 0.5px;
}

/* Responsive */
@media (max-width: 500px) {
  .links-grid { grid-template-columns: 1fr; }
  .name { font-size: 26px; }
  .container { padding: 32px 20px; }
  .avatar { width: 80px; height: 80px; font-size: 28px; }
}
</style>

<script>
// DotGrid
const canvas = document.getElementById('dot-grid');
const ctx = canvas.getContext('2d');
let dots = [];
const SPACING = 32;
const RADIUS = 1.2;

function resize() {
  const w = canvas.width = window.innerWidth;
  const h = canvas.height = window.innerHeight;
  generateDots(w, h);
}

function generateDots(w, h) {
  dots = [];
  const cols = Math.ceil(w / SPACING) + 1;
  const rows = Math.ceil(h / SPACING) + 1;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      dots.push({
        x: c * SPACING + (r % 2) * (SPACING / 2),
        y: r * SPACING,
        ox: (Math.random() - 0.5) * 2,
        oy: (Math.random() - 0.5) * 2,
      });
    }
  }
}

function getDotColor() {
  return document.documentElement.classList.contains('dark') ? '#1a1a1a' : '#d0d0d0';
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const color = getDotColor();
  ctx.clearRect(0, 0, w, h);

  const time = Date.now() / 4000;

  for (const d of dots) {
    const dx = Math.sin(time + d.x * 0.01) * d.ox;
    const dy = Math.cos(time + d.y * 0.01) * d.oy;
    const x = d.x + dx;
    const y = d.y + dy;

    if (x < -SPACING || x > w + SPACING || y < -SPACING || y > h + SPACING) continue;

    ctx.beginPath();
    ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

resize();
draw();
window.addEventListener('resize', resize);

// Theme toggle
const toggle = document.getElementById('theme-toggle');

function setTheme(dark) {
  if (dark) {
    document.documentElement.classList.add('dark');
    toggle.textContent = 'L';
  } else {
    document.documentElement.classList.remove('dark');
    toggle.textContent = 'D';
  }
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}

const saved = localStorage.getItem('theme');
if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  setTheme(true);
}

toggle.addEventListener('click', () => {
  setTheme(!document.documentElement.classList.contains('dark'));
});
</script>
